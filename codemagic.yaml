workflows:
  android-cloud-debug:
    name: Deutsch A1 – Mein Coach V0.2 Cloud APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Install Gradle 8.9
        script: |
          set -e
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          rm -rf /tmp/gradle-8.9
          unzip -q /tmp/gradle.zip -d /tmp
          echo 'export PATH="/tmp/gradle-8.9/bin:$PATH"' >> "$CM_ENV"
      - name: Build installable debug APK
        script: |
          set -e
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
